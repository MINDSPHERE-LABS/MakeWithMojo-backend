name: Deploy to Mobile Termux Server

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-serv

jobs:
  deploy:
    name: Deploy to Android Termux
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass ssh netcat-openbsd

      - name: Debug Network & SSH Connection
        run: |
          echo "=========================================="
          echo "🔍 DIAGNOSTIC STEP: Checking Network & DNS"
          echo "=========================================="
          echo "Target Host: ${{ secrets.MOBILE_SSH_HOST }}"
          echo "Target Port: ${{ secrets.MOBILE_SSH_PORT }}"
          
          echo "1. Resolving DNS..."
          nslookup ${{ secrets.MOBILE_SSH_HOST }} || true

          echo "2. Testing Port Connection..."
          nc -zv -w 10 ${{ secrets.MOBILE_SSH_HOST }} ${{ secrets.MOBILE_SSH_PORT }} || true
          echo "=========================================="

      - name: Execute Remote Deployment via Native SSH
        env:
          SSH_HOST: ${{ secrets.MOBILE_SSH_HOST }}
          SSH_PORT: ${{ secrets.MOBILE_SSH_PORT }}
          SSH_USER: ${{ secrets.MOBILE_SSH_USER }}
          SSH_PASS: ${{ secrets.MOBILE_SSH_PASS }}
        run: |
          echo "=========================================="
          echo "🚀 Connecting via Native SSH to $SSH_USER@$SSH_HOST:$SSH_PORT..."
          echo "=========================================="

          sshpass -p "$SSH_PASS" ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            echo "=========================================="
            echo "🎉 SSH LOGIN SUCCESSFUL! Connected to Termux"
            echo "=========================================="
            echo "User: $(whoami)"
            echo "Path: $(pwd)"
            echo "System: $(uname -a)"
            echo "=========================================="

            if [ -d "$HOME/MakeWithMojo-backend" ]; then
              cd "$HOME/MakeWithMojo-backend"
            elif [ -d "~/MakeWithMojo-backend" ]; then
              cd ~/MakeWithMojo-backend
            else
              echo "Error: MakeWithMojo-backend directory not found!"
              exit 1
            fi

            echo "📥 Pulling latest code..."
            git checkout mobile-serv
            git pull origin mobile-serv

            echo "📦 Installing Python dependencies..."
            pip install -r requirements.txt

            echo "🔄 Restarting FastAPI Uvicorn Server..."
            pkill -f "uvicorn app.main:app" || true
            sleep 2

            nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
            
            echo "=========================================="
            echo "✅ Mobile Server Deployment Successfully Completed!"
            echo "=========================================="
          EOF
