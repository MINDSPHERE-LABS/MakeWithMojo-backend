name: Deploy to Mobile Termux Server

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-serv

jobs:
  deploy:
    name: Deploy to Android Termux
    runs-on: ubuntu-latest
    steps:
      - name: Debug SSH Host & Network Connectivity
        run: |
          echo "=========================================="
          echo "🔍 DIAGNOSTIC STEP: Checking Network & DNS"
          echo "=========================================="
          echo "Target Host: ${{ secrets.MOBILE_SSH_HOST }}"
          echo "Target Port: ${{ secrets.MOBILE_SSH_PORT }}"
          
          echo "1. Resolving DNS for target host..."
          nslookup ${{ secrets.MOBILE_SSH_HOST }} || true

          echo "2. Testing TCP Port Connection..."
          nc -zv -w 10 ${{ secrets.MOBILE_SSH_HOST }} ${{ secrets.MOBILE_SSH_PORT }} || true
          echo "=========================================="

      - name: Executing remote SSH commands for deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MOBILE_SSH_HOST }}
          port: ${{ secrets.MOBILE_SSH_PORT }}
          username: ${{ secrets.MOBILE_SSH_USER }}
          password: ${{ secrets.MOBILE_SSH_PASS }}
          timeout: 60s
          command_timeout: 10m
          debug: true
          script: |
            echo "=========================================="
            echo "🎉 SSH LOGIN SUCCESSFUL! Connected to Mobile Termux Server"
            echo "=========================================="
            echo "Logged in as: $(whoami)"
            echo "Current Working Directory: $(pwd)"
            echo "System Info: $(uname -a)"
            echo "=========================================="

            if [ -d "$HOME/MakeWithMojo-backend" ]; then
              cd "$HOME/MakeWithMojo-backend"
            elif [ -d "~/MakeWithMojo-backend" ]; then
              cd ~/MakeWithMojo-backend
            else
              echo "Error: MakeWithMojo-backend directory not found!"
              exit 1
            fi

            echo "📥 Pulling latest code..."
            git checkout mobile-serv
            git pull origin mobile-serv

            echo "📦 Installing Python dependencies..."
            pip install -r requirements.txt

            echo "🔄 Restarting FastAPI Uvicorn Server..."
            pkill -f "uvicorn app.main:app" || true
            sleep 2

            nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
            
            echo "=========================================="
            echo "✅ Mobile Server Deployment Successfully Completed!"
            echo "=========================================="
